<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <base href="/ink-fox/">
    <title>墨间有狐</title>
    <meta name="description" content="一只水墨狐狸栖在江岸。点它，它会侧耳提爪。点亮音符，可以听一段古风配乐。">
    <link rel="stylesheet" href="scene.css">
    <link rel="preload" href="assets/river.webp" as="image">
    <script defer src="motion.js"></script>
    <script defer src="fox.js"></script>
    <script defer src="fox-ink.js"></script>
    <script defer src="fox-painted.js"></script>
    <script defer src="scene.js"></script>
    <script defer src="music.js"></script>
  </head>
  <body>
    <main class="scene" aria-label="墨间有狐">
      <canvas id="scene" role="img" aria-label="水墨江岸上的狐狸，江雾、水波与芦苇轻轻变化。"></canvas>
      <p id="message" class="message" role="status" hidden></p>
      <div class="controls" role="group" aria-label="画面控制">
        <button id="music" type="button" aria-label="播放音乐" title="播放音乐" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 17.5V6.5l10-2v10.7M9 17.5c0 1.2-1.16 2.2-2.6 2.2s-2.4-.72-2.4-1.75 1.16-2.14 2.6-2.14c1.18 0 2.13.65 2.4 1.69Zm10-2.3c0 1.2-1.16 2.2-2.6 2.2s-2.4-.72-2.4-1.75 1.16-2.14 2.6-2.14c1.18 0 2.13.65 2.4 1.69Z"/>
            <path class="music-off" d="M4 4l16 16"/>
          </svg>
        </button>
        <button id="pause" type="button" aria-label="暂停" title="暂停（空格）" aria-pressed="false">
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12m6-12v12"/></svg>
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"/></svg>
        </button>
        <button id="restart" type="button" aria-label="再入画" title="再入画">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6m-.6-10v5.5H14"/></svg>
        </button>
      </div>
    </main>
  </body>
</html>
